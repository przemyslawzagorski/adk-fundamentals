name: code-analyst-ci

on:
  push:
    paths:
      - "adk_training/module_13_code_analyst/**"
      - ".github/workflows/code-analyst.yml"
  pull_request:
    paths:
      - "adk_training/module_13_code_analyst/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adk_training/module_13_code_analyst
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: adk_training/module_13_code_analyst/requirements.txt

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install pytest ruff mypy

      - name: Ruff (lint)
        run: ruff check .

      - name: Pytest
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: adk_training/module_13_code_analyst
          push: false
          tags: code-analyst:ci
