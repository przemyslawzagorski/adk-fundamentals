name: AI Code Review

on:
  pull_request:
    branches: [main, master]

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Auggie CLI + SDK
        run: |
          npm install -g @augmentcode/auggie
          pip install -r adk_training/module_23_auggie_integration/requirements.txt

      - name: Generate diff
        run: git diff origin/${{ github.base_ref }}...HEAD > pr.diff

      - name: Run AI review
        env:
          AUGMENT_SESSION_AUTH: ${{ secrets.AUGMENT_SESSION_AUTH }}
          AUGGIE_MODEL: sonnet4.5
        run: |
          python adk_training/module_23_auggie_integration/ci_review.py \
            --diff-file=pr.diff \
            --output=review.json \
            --fail-on=major \
            --repo-context="${{ github.event.pull_request.title }}"

      - name: Upload review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-code-review
          path: review.json

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = JSON.parse(fs.readFileSync('review.json', 'utf8'));
            if (review.error) return;
            const issues = (review.issues || []).map(i =>
              `- **[${i.severity}]** \`${i.file}:${i.line}\` (${i.category})\n  ${i.description}\n  *Fix:* ${i.suggested_fix}`
            ).join('\n');
            const body = `## AI Code Review (Auggie)\n\n**Verdict:** ${review.approval}\n\n${review.summary}\n\n${issues || 'No issues found.'}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
