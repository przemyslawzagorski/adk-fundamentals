site_name: Code Analyst — Dokumentacja
site_description: >
  Produkcyjny agent AI do analizy i modyfikacji kodu — ADK + RAG + FastAPI.
  Dokumentacja dla biznesu, developerów i ekspertów.
site_author: Code Analyst Team
site_url: https://example.invalid/code-analyst/
repo_url: https://example.invalid/code-analyst
repo_name: code-analyst
edit_uri: ""

docs_dir: docs
use_directory_urls: true
strict: false

theme:
  name: material
  language: pl
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Tryb ciemny
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Tryb jasny
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  icon:
    repo: fontawesome/brands/git-alt
  font:
    text: Inter
    code: JetBrains Mono

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.critic
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols

plugins:
  - search:
      lang: pl

nav:
  - Start: index.md
  - Dla biznesu:
      - biznes/wartosc.md
      - biznes/scenariusze.md
      - biznes/ryzyka-i-zgodnosc.md
      - biznes/roi-i-metryki.md
  - Architektura:
      - architektura/przeglad.md
      - architektura/komponenty.md
      - architektura/przeplyw-danych.md
      - architektura/workflows.md
  - Bezpieczeństwo:
      - bezpieczenstwo/model-zagrozen.md
      - bezpieczenstwo/autoryzacja.md
      - bezpieczenstwo/path-traversal.md
      - bezpieczenstwo/prompt-injection.md
      - bezpieczenstwo/audyt.md
  - Dla dewelopera:
      - deweloper/quick-start.md
      - deweloper/konfiguracja.md
      - deweloper/api.md
      - deweloper/testy.md
      - deweloper/rozszerzanie.md
  - Operacje:
      - operacje/deployment.md
      - operacje/monitoring.md
      - operacje/logowanie.md
      - operacje/rate-limiting.md
      - operacje/troubleshooting.md
  - Dla eksperta:
      - ekspert/adk-wewnetrznie.md
      - ekspert/rag-wewnetrznie.md
      - ekspert/multi-tenant.md
  - Historia: changelog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://example.invalid
  generator: false

copyright: >
  Code Analyst — materiały szkoleniowe ADK Fundamentals.
