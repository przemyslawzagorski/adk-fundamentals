site_name: ADK Fundamentals — Platform
site_description: >
  AI Code Concierge (module_23) + AuditOps (module_24) — single product surface.
  Two-tier ADK + Auggie orchestration with progressive-disclosure skills,
  per-target wikis, MCP server, cost tracking, resilience and audit guardrails.
site_url: http://localhost:8765/
docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Light mode
  icon:
    repo: fontawesome/brands/git-alt

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/

plugins:
  - search
  - monorepo

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Quick start: quick-start.md
  - Architecture: architecture.md
  - Patterns:
      - patterns/index.md
      - Progressive disclosure (skills): patterns/progressive-disclosure.md
      - Per-target wiki: patterns/audit-wiki.md
      - Recon → skill activation: patterns/recon-to-skill.md
      - MkDocs as monorepo: patterns/mkdocs-monorepo.md
  - Features catalog: features-catalog.md
  - Concierge: '!include ./adk_training/module_23_auggie_integration/mkdocs.yml'
  - Auditops: '!include ./adk_training/module_24_audit_ops/mkdocs.yml'
  - Decision guide: decision-guide.md
